<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Khanfem Owner Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .adm-wrap{max-width:1180px;margin:0 auto;padding:32px 20px 72px}.adm-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.adm-brand{font-size:1.5rem;font-weight:700;color:inherit;text-decoration:none}.adm-panel{background:#fff;border:1px solid #e5e1d7;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 8px 28px #1d26100b}.adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.adm-stat{background:#f6f5ef;border-radius:12px;padding:16px}.adm-stat small{display:block;color:#666;margin-bottom:7px}.adm-stat strong{font-size:1.35rem}.adm-tabs{display:flex;gap:8px;flex-wrap:wrap}.adm-tabs button,.adm-btn{border:1px solid #6f7650;border-radius:999px;background:#fff;padding:9px 14px;color:#30331f;cursor:pointer}.adm-tabs button[aria-selected=true],.adm-btn--primary{background:#59623c;color:#fff}.adm-table-wrap{overflow:auto}.adm-table{border-collapse:collapse;width:100%;min-width:720px}.adm-table th,.adm-table td{text-align:left;border-bottom:1px solid #ece9e1;padding:11px 9px;vertical-align:top}.adm-table th{font-size:.78rem;text-transform:uppercase;color:#6b6c5e}.adm-field{display:grid;gap:6px;margin:12px 0}.adm-field input{padding:11px;border:1px solid #ccc9bd;border-radius:8px}.adm-error{color:#9b2922}.adm-note{color:#666}.adm-row-actions{display:flex;gap:6px;flex-wrap:wrap}.adm-row-actions select{padding:8px;border-radius:8px;border:1px solid #ccc9bd}.adm-hidden{display:none!important}.adm-nav{font-size:.9rem;color:inherit}.adm-section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.adm-section-title h2{margin:0}.adm-name{font-size:.9rem;color:#5d6248}@media(max-width:600px){.adm-wrap{padding:22px 12px}.adm-panel{padding:14px}.adm-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="adm-wrap">
    <header class="adm-head"><a class="adm-brand" href="index.html">Khanfem <span class="adm-name">Owner</span></a><nav class="adm-nav"><a href="index.html">View customer site</a></nav></header>
    <section id="admLogin" class="adm-panel" aria-labelledby="admLoginTitle">
      <h1 id="admLoginTitle">Owner sign in</h1><p class="adm-note">Management access is restricted to authorized Khanfem owners.</p>
      <form id="admLoginForm"><label class="adm-field">Email<input name="email" type="email" required autocomplete="username"></label><label class="adm-field">Password<input name="password" type="password" required autocomplete="current-password"></label><button class="adm-btn adm-btn--primary" type="submit">Sign in</button><p id="admLoginError" class="adm-error" role="alert"></p></form>
    </section>
    <section id="admDashboard" class="adm-hidden" aria-live="polite">
      <div class="adm-head"><div><h1>Owner dashboard</h1><p id="admWelcome" class="adm-note"></p></div><button id="admLogout" class="adm-btn">Sign out</button></div>
      <p id="admError" class="adm-error" role="alert"></p><div id="admStats" class="adm-grid"></div>
      <section class="adm-panel"><div class="adm-tabs" role="tablist"><button data-tab="orders" aria-selected="true">Orders</button><button data-tab="reservations" aria-selected="false">Reservations</button><button data-tab="reviews" aria-selected="false">Reviews</button><button data-tab="products" aria-selected="false">Products</button></div></section>
      <section class="adm-panel"><div class="adm-section-title"><h2 id="admPanelTitle">Orders</h2><button class="adm-btn" id="admRefresh">Refresh</button></div><div id="admPanel" class="adm-table-wrap"></div></section>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
